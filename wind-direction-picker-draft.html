<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wind Direction Picker Draft</title>
    <style>
      @font-face {
        font-family: "Barlow Condensed";
        src: url("/fonts/barlow-condensed-600.woff2") format("woff2");
        font-weight: 600;
        font-display: swap;
      }

      :root {
        color-scheme: dark;
        font-family: "Barlow Condensed", Arial, sans-serif;
        background: #071012;
        color: #c9e4dd;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .panel {
        width: min(100%, 620px);
        transform: rotate(-0.35deg);
        border: 5px solid #080808;
        border-radius: 22px 7px 20px 8px;
        background: #c9e4dd;
        box-shadow: 9px 10px 0 #ff3d8d;
        padding: clamp(22px, 6vw, 42px);
        color: #04090b;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.5rem, 5vw, 2.25rem);
        line-height: 1;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .intro {
        max-width: 42ch;
        margin: 10px 0 28px;
        color: #314c4b;
        font-size: 1rem;
        line-height: 1.35;
      }

      fieldset {
        margin: 0;
        border: 0;
        padding: 0;
      }

      legend {
        margin-bottom: 16px;
        font-size: 0.8rem;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .compass {
        display: grid;
        grid-template-columns: repeat(3, minmax(76px, 112px));
        grid-template-areas:
          "nw n ne"
          "w center e"
          "sw s se";
        place-content: center;
        gap: clamp(8px, 2.5vw, 15px);
      }

      .direction input {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        clip-path: inset(50%);
        white-space: nowrap;
      }

      .direction label {
        display: grid;
        min-height: 92px;
        cursor: pointer;
        place-items: center;
        gap: 2px;
        border: 2px solid transparent;
        border-radius: 5px;
        padding: 8px;
        transition:
          background 120ms ease,
          transform 120ms ease;
      }

      .direction label:hover {
        background: rgb(62 230 207 / 18%);
        transform: scale(1.04);
      }

      .direction input:focus-visible + label {
        outline: 4px solid #ff3d8d;
        outline-offset: 2px;
      }

      .direction svg {
        width: 50px;
        height: 50px;
        overflow: visible;
      }

      .direction path {
        fill: transparent;
        stroke: #31504e;
        stroke-width: 2.5;
        stroke-linejoin: round;
        vector-effect: non-scaling-stroke;
        transition:
          fill 120ms ease,
          stroke 120ms ease;
      }

      .direction input:checked + label path {
        fill: #ff3d8d;
        stroke: #04090b;
      }

      .direction input:checked + label .direction-name {
        background: #04090b;
        color: #c9e4dd;
      }

      .direction-name {
        min-width: 30px;
        border: 2px solid #04090b;
        padding: 1px 5px;
        text-align: center;
        font-size: 0.8rem;
        font-weight: 600;
        line-height: 1;
      }

      .center {
        grid-area: center;
        display: grid;
        place-items: center;
        color: #314c4b;
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        line-height: 1.05;
        text-align: center;
        text-transform: uppercase;
      }

      .n {
        grid-area: n;
      }
      .ne {
        grid-area: ne;
      }
      .e {
        grid-area: e;
      }
      .se {
        grid-area: se;
      }
      .s {
        grid-area: s;
      }
      .sw {
        grid-area: sw;
      }
      .w {
        grid-area: w;
      }
      .nw {
        grid-area: nw;
      }

      .n svg {
        transform: rotate(180deg);
      }
      .ne svg {
        transform: rotate(225deg);
      }
      .e svg {
        transform: rotate(270deg);
      }
      .se svg {
        transform: rotate(315deg);
      }
      .s svg {
        transform: rotate(0deg);
      }
      .sw svg {
        transform: rotate(45deg);
      }
      .w svg {
        transform: rotate(90deg);
      }
      .nw svg {
        transform: rotate(135deg);
      }

      @media (max-width: 430px) {
        body {
          padding: 14px;
        }

        .panel {
          padding: 22px 14px 26px;
        }

        .compass {
          grid-template-columns: repeat(3, minmax(70px, 92px));
          gap: 5px;
        }

        .direction label {
          min-height: 82px;
          padding: 5px;
        }

        .direction svg {
          width: 42px;
          height: 42px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .direction label,
        .direction path {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <h1>Accepted wind directions</h1>
      <p class="intro">
        Pick the directions worth showing. Arrows point inward to show where the wind comes from.
      </p>

      <fieldset>
        <legend>Wind from</legend>
        <div class="compass">
          <div class="direction nw">
            <input id="direction-nw" type="checkbox" checked />
            <label for="direction-nw" title="Northwest">
              <svg viewBox="0 0 48 48" aria-hidden="true">
                <path d="M24 3 39 20h-9v25H18V20H9Z" />
              </svg>
              <span class="direction-name">NW</span>
            </label>
          </div>

          <div class="direction n">
            <input id="direction-n" type="checkbox" checked />
            <label for="direction-n" title="North">
              <svg viewBox="0 0 48 48" aria-hidden="true">
                <path d="M24 3 39 20h-9v25H18V20H9Z" />
              </svg>
              <span class="direction-name">N</span>
            </label>
          </div>

          <div class="direction ne">
            <input id="direction-ne" type="checkbox" checked />
            <label for="direction-ne" title="Northeast">
              <svg viewBox="0 0 48 48" aria-hidden="true">
                <path d="M24 3 39 20h-9v25H18V20H9Z" />
              </svg>
              <span class="direction-name">NE</span>
            </label>
          </div>

          <div class="direction w">
            <input id="direction-w" type="checkbox" />
            <label for="direction-w" title="West">
              <svg viewBox="0 0 48 48" aria-hidden="true">
                <path d="M24 3 39 20h-9v25H18V20H9Z" />
              </svg>
              <span class="direction-name">W</span>
            </label>
          </div>

          <div class="center" aria-hidden="true">Wind<br />direction</div>

          <div class="direction e">
            <input id="direction-e" type="checkbox" />
            <label for="direction-e" title="East">
              <svg viewBox="0 0 48 48" aria-hidden="true">
                <path d="M24 3 39 20h-9v25H18V20H9Z" />
              </svg>
              <span class="direction-name">E</span>
            </label>
          </div>

          <div class="direction sw">
            <input id="direction-sw" type="checkbox" />
            <label for="direction-sw" title="Southwest">
              <svg viewBox="0 0 48 48" aria-hidden="true">
                <path d="M24 3 39 20h-9v25H18V20H9Z" />
              </svg>
              <span class="direction-name">SW</span>
            </label>
          </div>

          <div class="direction s">
            <input id="direction-s" type="checkbox" />
            <label for="direction-s" title="South">
              <svg viewBox="0 0 48 48" aria-hidden="true">
                <path d="M24 3 39 20h-9v25H18V20H9Z" />
              </svg>
              <span class="direction-name">S</span>
            </label>
          </div>

          <div class="direction se">
            <input id="direction-se" type="checkbox" />
            <label for="direction-se" title="Southeast">
              <svg viewBox="0 0 48 48" aria-hidden="true">
                <path d="M24 3 39 20h-9v25H18V20H9Z" />
              </svg>
              <span class="direction-name">SE</span>
            </label>
          </div>
        </div>
      </fieldset>
    </main>
  </body>
</html>
