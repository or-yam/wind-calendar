allowBuilds:
  "@sentry/cli": true
  esbuild: true
# Targeted security patches for vulnerable resolved dependency versions.
overrides:
  esbuild@0.27.7: 0.28.1
  undici@6.28.0: 6.28.1
  # vercel 58.11.0 pins @vercel/fun 1.3.0, which pins vulnerable tar 7.5.7 and
  # @tootallnate/once 2.0.0. 1.3.6 is the same major and ships the patched
  # tar 7.5.22 / once 2.0.1.
  "vercel@58.11.0>@vercel/fun": 1.3.6
minimumReleaseAgeExclude:
  - "@vercel/container@0.2.0"
  - "@vercel/python@6.56.2"
  - "@vercel/rust@1.4.2"
  - "@vercel/vc-native-darwin-arm64@58.10.0"
  - "@vercel/vc-native-darwin-x64@58.10.0"
  - "@vercel/vc-native-linux-arm64@58.10.0"
  - "@vercel/vc-native-linux-x64@58.10.0"
  - vercel@58.10.0
  - "@ai-sdk/gateway@4.0.51"
  - ai@7.0.64
